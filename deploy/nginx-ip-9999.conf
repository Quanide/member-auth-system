# ============================================================
# 備用入口：以 IP + 9999 埠直接存取
#
# 用途：網域解析尚未生效時，仍可透過 http://<IP>:9999 操作。
# 獨立 server 區塊，不影響本機上其他站點的 80 / 443 設定。
# ============================================================
server
{
    listen 9999;
    server_name _;

    root /www/wwwroot/wanghui.aipod.works/public;
    index index.html index.php;

    access_log /www/wwwlogs/wanghui.aipod.works.9999.log;
    error_log  /www/wwwlogs/wanghui.aipod.works.9999.error.log;

    client_max_body_size 8m;

    # 帶 hash 的建置產物
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 使用者上傳的頭像
    location ^~ /storage/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ^~ 讓這些前綴優先於副檔名正則，避免 API 請求被靜態規則攔截
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # SPA 入口
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    location ~ [^/]\.php(/|$) {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;
    }

    # 敏感檔案一律擋掉
    location ~* /(\.env|\.git|composer\.(json|lock)|package(-lock)?\.json) {
        return 404;
    }
}

# ============================================================
# 会员登入系统 — Laravel API + Vue SPA 同域部署
#
# 放在宝塔的 extension 目录下，面板操作不会覆盖它。
# 需要搭配站点「运行目录」设为 /public（Laravel 的入口目录）。
#
# 路由分派：
#   /api/*      -> Laravel（业务接口）
#   /sanctum/*  -> Laravel（CSRF cookie）
#   /up         -> Laravel（健康检查）
#   /storage/*  -> 静态档案（使用者头像）
#   其余        -> Vue SPA 的 index.html（前端路由自行接手）
# ============================================================

# 带 hash 的建置产物，内容变了档名就会变，可以放心长快取
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# 使用者上传的头像（storage/app/public 的软连结）
location ^~ /storage/ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

# ^~ 让这些前缀优先于下方的副档名正则，避免 API 请求被静态规则拦截
location ^~ /api/ {
    try_files $uri /index.php?$query_string;
}

location ^~ /sanctum/ {
    try_files $uri /index.php?$query_string;
}

location = /up {
    try_files $uri /index.php?$query_string;
}

# SPA 入口：找不到实体档案就交给前端路由
# 这里必须显式指定 index index.html，
# 否则会落到 server 层 index 指令里排在前面的 index.php，首页变成 Laravel 的 404。
location / {
    index index.html;
    try_files $uri $uri/ /index.html;
}

# index.html 不快取，否则前端发版后使用者会一直拿到旧的资源清单
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    expires -1;
}

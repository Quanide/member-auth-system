# ============================================================
# 會員登入系統 — Laravel API + Vue SPA 同域部署
#
# 放在寶塔的 extension 目錄下，面板操作不會覆蓋它。
# 需要搭配站點「運行目錄」設為 /public（Laravel 的入口目錄）。
#
# 路由分派：
#   /api/*      -> Laravel（業務接口）
#   /sanctum/*  -> Laravel（CSRF cookie）
#   /up         -> Laravel（健康檢查）
#   /storage/*  -> 靜態檔案（使用者頭像）
#   其餘        -> Vue SPA 的 index.html（前端路由自行接手）
# ============================================================

# 帶 hash 的建置產物，內容變了檔名就會變，可以放心長快取
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# 使用者上傳的頭像（storage/app/public 的軟連結）
location ^~ /storage/ {
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri =404;
}

# ^~ 讓這些前綴優先於下方的副檔名正則，避免 API 請求被靜態規則攔截
location ^~ /api/ {
    try_files $uri /index.php?$query_string;
}

location ^~ /sanctum/ {
    try_files $uri /index.php?$query_string;
}

location = /up {
    try_files $uri /index.php?$query_string;
}

# SPA 入口：找不到實體檔案就交給前端路由
# 這裡必須顯式指定 index index.html，
# 否則會落到 server 層 index 指令裡排在前面的 index.php，首頁變成 Laravel 的 404。
location / {
    index index.html;
    try_files $uri $uri/ /index.html;
}

# index.html 不快取，否則前端發版後使用者會一直拿到舊的資源清單
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    expires -1;
}
